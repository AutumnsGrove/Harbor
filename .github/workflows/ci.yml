# Harbor's whole CI. If `make check` is green locally, the check/web/watcher/
# packaging jobs should be green here; the image and publish jobs are the parts a
# laptop cannot do.
#
# One rule shapes the file: a pull request can never reach the registry. The
# publish job needs every test job and only runs on a push to main. A manual
# dispatch publishes a spare tag (default `broken-test`) and never moves
# `latest` — the rollback drill does move `latest` on purpose, from a machine
# with write:packages, and is written down in docs/update.md.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Tag to publish on a manual dispatch (never `latest`)'
        required: false
        default: broken-test

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: '1.27.x'
  NODE_VERSION: '22'
  PNPM_VERSION: '10.32.1'

jobs:
  check:
    name: Go (fmt, vet, race)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      # CGO_ENABLED=1: the race detector needs cgo. The shipped binary stays
      # CGO_ENABLED=0, and the image job proves that separately.
      - run: make fmt-check
      - run: make vet
      - run: make test

  fuzz:
    name: Fuzz (30s per target)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: FUZZTIME=30s make fuzz

  web:
    name: Web (svelte-check, vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: cd web && pnpm install --frozen-lockfile
      - run: make web-check

  watcher:
    name: Update watcher (shell)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: make watcher-check

  packaging:
    name: Packaging rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      # The build is needed for the rules that inspect the shipped shell
      # (no off-host addresses, no unsafe-inline).
      - run: cd web && pnpm install --frozen-lockfile && pnpm build
      - run: make packaging

  image:
    name: Image (uid, no Node, healthz)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build
        run: |
          version="r$(git rev-list --count HEAD).$(git rev-parse --short HEAD)"
          docker buildx build --load --build-arg VERSION="$version" -t harbor:ci .
      - name: Inspect and run
        run: ./scripts/image-check.sh harbor:ci

  publish:
    name: Publish image
    # A push to main, or a manual dispatch for the rollback drill. Never a PR.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: [check, fuzz, web, watcher, packaging, image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # commit count for the version stamp

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve version and tags
        id: meta
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          short="$(git rev-parse --short HEAD)"
          version="r$(git rev-list --count HEAD).${short}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            # A drill image: deliberately never `latest`, so a broken test tag
            # cannot become what the watcher resolves.
            tag="${{ inputs.image_tag }}"
            echo "tags=${repo}:${tag:-broken-test}" >> "$GITHUB_OUTPUT"
          else
            echo "tags=${repo}:latest,${repo}:${short}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### Published"
            echo
            echo "- version: \`${{ steps.meta.outputs.version }}\`"
            echo "- tags: \`${{ steps.meta.outputs.tags }}\`"
            echo
            if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
              echo "Manual dispatch: \`latest\` was not moved. This tag is a spare image, not a drill:"
              echo "the watcher always resolves \`latest\`. The rollback drill (move \`latest\`,"
              echo "watch the watcher restore the old digest) is in docs/update.md."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
