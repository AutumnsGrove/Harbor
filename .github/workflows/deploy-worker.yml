# Deploying the Worker, separately from the Harbor image.
#
# The Worker is the public front door (a write-only queue, worker/README.md). It
# changes on its own schedule, so it gets its own workflow and its own token
# rather than riding on the image publish: `main` can be a new Harbor without a
# new Worker, and the other way round.
#
# Required repository secrets:
#   CLOUDFLARE_API_TOKEN   scoped to Workers Scripts:Edit (+ Workers Routes if
#                          routes are added). It is not the R2 credential.
# Required repository variables:
#   CLOUDFLARE_ACCOUNT_ID  the account wrangler deploys into
#
# The R2 read credential the /presign route signs with is a Worker *secret*
# (R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY), set once with
# `wrangler secret put`. It never lives in this repository or in CI.
name: deploy-worker

# Workflow-level, because `env.*` in a `with:` resolves only workflow/job/step
# env — not repository variables. Without these, pnpm/action-setup gets an empty
# version and fails before the install.
env:
  PNPM_VERSION: '10.32.1'
  NODE_VERSION: '22'

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time, and a newer commit wins: a superseded deploy would
# publish an older Worker over a newer one.
concurrency:
  group: deploy-worker
  cancel-in-progress: true

jobs:
  deploy:
    name: Worker (deploy)
    runs-on: ubuntu-latest
    steps:
      # Full history: the version stamp is `r<commit count>.<sha>`, which needs
      # `git rev-list --count HEAD`.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: worker/pnpm-lock.yaml

      - run: cd worker && pnpm install --frozen-lockfile

      # The same checks the PR job runs, again on the commit that is about to
      # become the public door. Cheap, and the token cannot deploy something the
      # suite has not seen.
      - run: cd worker && pnpm typecheck && pnpm test

      - name: Deploy
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        # The stamp the Worker reports on /healthz, so "what is live" names a
        # commit rather than "dev". `--var` merges with [vars], it does not
        # replace them.
        run: >-
          pnpm exec wrangler deploy
          --var VERSION:r$(git rev-list --count HEAD).$(git rev-parse --short HEAD)

      - name: Show what is live
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        # Informational: the deploy above already happened, so a failure here
        # must not turn a successful deploy red.
        run: pnpm exec wrangler deployments list --name harbor 2>/dev/null || true
